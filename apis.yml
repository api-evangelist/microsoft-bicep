name: Microsoft Bicep
description: >-
  Microsoft Bicep is a domain-specific language (DSL) that uses declarative syntax to deploy Azure resources. It
  provides a transparent abstraction over ARM templates and offers a more concise syntax, improved type safety, and
  better support for modularity and code reuse.
